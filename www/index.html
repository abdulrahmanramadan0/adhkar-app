:root{--bg:#dcc3a0;--card:#ece8e1;--ink:#1a1816;--red:#a23b2a;--gold:#d9a441;--soft:#c9ab82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a211a;--card:#3a3028;--ink:#f1e9dc;--red:#d4624d;--gold:#e8b44f;--soft:#4b3d31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Milan','Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 14px 28px}
h1{font-family:'Milan','Noto Kufi Arabic',serif;font-size:26px;margin:6px 0 2px;color:var(--red)}
.sub{font-size:13px;opacity:.7;margin-bottom:12px}
.tabs{display:flex;background:var(--soft);border-radius:40px;padding:4px;gap:4px;margin-bottom:10px}
.tab{border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--ink);padding:9px 26px;border-radius:30px;cursor:pointer;transition:.25s}
.tab.on{background:var(--red);color:#fff;box-shadow:0 4px 12px #a23b2a55}
.prog{width:min(440px,100%);height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.pl{font-size:12px;opacity:.7;margin:5px 0 12px}
.stage{width:min(440px,100%);display:flex;align-items:center;gap:6px}
.nav{border:0;background:var(--soft);color:var(--red);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.nav:disabled{opacity:.3}
.card{flex:1;position:relative;background:var(--card);min-height:440px;padding:34px 22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 border:5px solid var(--red);outline:2px solid var(--red);outline-offset:-13px;box-shadow:0 14px 30px #0003;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.card.done{border-color:var(--gold);outline-color:var(--gold)}
.t{font-weight:800;font-size:25px;line-height:2;margin:0}
.t.long{font-size:17px;line-height:2.1;font-weight:700}
.div{display:flex;align-items:center;gap:8px;margin:16px 0;color:var(--gold)}
.div:before,.div:after{content:"";width:46px;height:2px;background:var(--gold)}
.div b{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.f{color:var(--red);font-size:16px;line-height:1.9;margin:0;font-weight:500}
.s{color:var(--red);font-size:12px;opacity:.85;margin:10px 0 0}
.dots{display:grid;gap:4px;margin-top:16px;justify-content:center}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.2;transition:.2s}
.dots span.on{opacity:1}
.btnrow{width:min(440px,100%);display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px}
.count{position:relative;width:112px;height:112px;border-radius:50%;border:0;background:var(--red);color:#fff;font:800 38px 'Milan','Noto Kufi Arabic',sans-serif;cursor:pointer;box-shadow:0 8px 20px #a23b2a66;transition:transform .1s}
.count:active{transform:scale(.92)}
.count small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:-4px}
.count.ok{background:var(--gold);color:#3a2a10}
.ring{position:absolute;inset:-8px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s}
.side{border:0;background:var(--soft);color:var(--ink);font:600 13px 'Milan','Noto Kufi Arabic',sans-serif;padding:10px 14px;border-radius:20px;cursor:pointer}
.idx{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px;max-width:440px}
.idx i{width:11px;height:11px;border-radius:50%;background:var(--soft);cursor:pointer}
.idx i.cur{background:var(--red);transform:scale(1.3)}
.idx i.dn{background:var(--gold)}
.fin{color:var(--red);font:700 22px 'Milan',serif;line-height:2}
</style>
</head>

<script>
const D=[
{t:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ",n:1,f:"آية الكرسي",s:"سورة البقرة ٢٥٥"},
{t:"قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",n:3,f:"سورة الإخلاص",s:"رواه أبو داود والترمذي"},
{t:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِنْ شَرِّ مَا خَلَقَ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",n:3,f:"سورة الفلق",s:"رواه أبو داود والترمذي"},
{t:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ",n:3,f:"سورة الناس",s:"رواه أبو داود والترمذي"},
{t:"اللَّهُمَّ بِكَ ؟١، وَبِكَ ؟٢،\nوَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ ؟٣",n:1,s:"صححه الألباني (صحيح الأدب المفرد)"},
{t:"؟٢ وَ؟٤ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:1,s:"رواه مسلم"},
{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",n:1,f:"سيد الاستغفار",s:"رواه البخاري"},
{t:"اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، لَا إِلَهَ إِلَّا أَنْتَ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",n:1,s:"رواه الترمذي وصححه الألباني"},
{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",n:1,s:"رواه أبو داود وصححه الألباني"},
{t:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ،\nأَصْلِحْ لِي شَأْنِي كُلَّهُ،\nوَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",n:1,s:"حسنه الألباني (صحيح الترغيب)"},
{t:"؟٢ عَلَى فِطْرَةِ الْإِسْلَامِ،\nوَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ،\nوَمِلَّةِ أَبِينَا إِبْرَاهِيمَ،\nحَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",n:1,s:"صححه الألباني (صحيح الجامع)"},
{t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",n:3,f:"ثلاث مرات",s:"رواه الترمذي وابن ماجة"},
{t:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ،\nعَلَيْهِ تَوَكَّلْتُ،\nوَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",n:7,f:"من قالها إذا أصبح وإذا أمسى سبعَ مرات\nكفاه اللّٰه ما أهمَّه",s:"عن أبي الدرداء رضي الله عنه · سنن أبي داود ٥٠٨١"},
{t:"رَضِيتُ بِاللَّهِ رَبًّا،\nوَبِالْإِسْلَامِ دِينًا،\nوَبِمُحَمَّدٍ ﷺ نَبِيًّا",n:3,f:"من قالها ثلاثًا حين يُصبح وثلاثًا حين يُمسي\nكان حقًّا على الله أن يُرضيَه يوم القيامة",s:"رواه أحمد"},
{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",n:100,f:"في يومٍ مئةَ مرة",s:"صحيح البخاري ٦٤٠٥"},
{t:"لَا إِلَهَ إِلَّا اللَّهُ\nوَحْدَهُ لَا شَرِيكَ لَهُ،\nلَهُ الْمُلْكُ وَلَهُ الْحَمْدُ،\nوَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:100,f:"في يومٍ مئةَ مرة",s:"صحيح البخاري ٣٢٩٣"}
];
const W={m:["أَصْبَحْنَا","أَمْسَيْنَا","النُّشُورُ","أَصْبَحَ"],e:["أَمْسَيْنَا","أَصْبَحْنَا","الْمَصِيرُ","أَمْسَى"]};
let mode=new Date().getHours()<15?'m':'e',cur=0,C={};
const day=new Date().toDateString(),K='adhkar-v1';
try{const x=JSON.parse(localStorage.getItem(K)||'{}');if(x.d===day)C=x.c||{}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify({d:day,c:C}))}catch(e){}};
const $=i=>document.getElementById(i);
const list=()=>D.map(o=>{const w=W[mode];const t=o.t.replace("؟١",w[0]).replace("؟٢",w[0]).replace("؟٣",w[2]).replace("؟٤",w[3]);
 let tt=o.t;
 tt=tt.replace("بِكَ ؟١، وَبِكَ ؟٢","بِكَ "+w[0]+"، وَبِكَ "+w[1]).replace("؟٢ وَ؟٤","@@");
 if(tt.includes("@@"))tt=tt.replace("@@",w[0]+" وَ"+w[3]);
 else if(tt.startsWith("؟٢"))tt=tt.replace("؟٢",w[0]);
 tt=tt.replace("؟٣",w[2]);
 return{...o,t:tt}});
const g=i=>C[mode+i]||0;
function render(){
 const L=list(),o=L[cur],c=g(cur),done=c>=o.n;
 $('tm').classList.toggle('on',mode=='m');$('te').classList.toggle('on',mode=='e');
 const dots=o.n<=100?Array.from({length:o.n},(_,i)=>`<span class="${i<c?'on':''}"></span>`).join(''):'';
 const cols=o.n>=20?10:o.n;
 $('card').className='card'+(done?' done':'');
 $('card').innerHTML=`<p class="t${o.t.length>110?' long':''}">${o.t.replace(/\n/g,'<br>')}</p><div class="div"><b></b></div>${o.f?`<p class="f">${o.f.replace(/\n/g,'<br>')}</p>`:''}<p class="s">${o.s}</p><div class="dots" style="grid-template-columns:repeat(${cols},7px)">${dots}</div>`;
 $('cn').textContent=done?'✓':c;$('cs').textContent='من '+o.n;
 $('ct').classList.toggle('ok',done);
 $('fg').style.strokeDashoffset=339.3*(1-Math.min(c/o.n,1));
 $('pv').disabled=cur==L.length-1;$('nx').disabled=cur==0;
 const dn=L.filter((x,i)=>g(i)>=x.n).length;
 $('pb').style.width=dn/L.length*100+'%';
 $('pl').textContent=dn==L.length?'تقبّل الله طاعتكم 🤍':`الذكر ${cur+1} من ${L.length} · أنجزت ${dn}`;
 $('idx').innerHTML=L.map((x,i)=>`<i class="${i==cur?'cur':''} ${g(i)>=x.n?'dn':''}" data-i="${i}"></i>`).join('');
}
function tap(){
 const o=list()[cur];let c=g(cur);if(c>=o.n)return;
 C[mode+cur]=++c;save();if(navigator.vibrate)navigator.vibrate(c>=o.n?[30,40,60]:12);
 render();
 if(c>=o.n&&cur<D.length-1)setTimeout(()=>{cur++;render()},650);
}
$('ct').onclick=tap;
$('card').onclick=tap;
$('nx').onclick=()=>{if(cur>0){cur--;render()}};
$('pv').onclick=()=>{if(cur<D.length-1){cur++;render()}};
$('rs').onclick=()=>{C[mode+cur]=0;save();render()};
$('ra').onclick=()=>{if(confirm('البدء من جديد لأذكار '+(mode=='m'?'الصباح':'المساء')+'؟')){D.forEach((_,i)=>delete C[mode+i]);cur=0;save();render()}};
$('tm').onclick=()=>{mode='m';cur=0;render()};
$('te').onclick=()=>{mode='e';cur=0;render()};
$('idx').onclick=e=>{const i=e.target.dataset.i;if(i!=null){cur=+i;render()}};
let sx=null;
$('card').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('card').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60){e.preventDefault();if(d>0&&cur>0)cur--;else if(d<0&&cur<D.length-1)cur++;render()}});
render();
</script>
</body>
</html>
